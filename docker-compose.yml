version: '3.8'

services:
  mongodb:
    image: mongo:8
    container_name: keystone-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      MONGO_INITDB_DATABASE: keystone

volumes:
  mongodb_data:
  mongodb_config:
